  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

items:center;gap:9px}\n  .inv .top img{height:30px;filter:brightness(0) invert(1)}\n  .inv .top .a{font-family:\"Zilla Slab\";font-weight:700;font-size:20px;color:var(--ember);line-height:.9}\n  .inv .top .b{font-family:\"Libre Franklin\";font-weight:700;font-size:7px;letter-spacing:.16em;text-transform:uppercase;color:rgba(243,239,231,.8)}\n  .inv .top .doc{font-family:\"Libre Franklin\";font-weight:700;font-size:10px;letter-spacing:.12em;color:var(--ember);text-transform:uppercase}\n  .inv .body2{padding:14px 18px}\n  .inv .li{display:flex;justify-content:space-between;font-size:12px;padding:7px 0;border-bottom:1px dashed var(--line);color:var(--ink-2)}\n  .inv .li .v{font-family:\"Zilla Slab\";font-weight:700;color:var(--ink)}\n  .inv .tot{display:flex;justify-content:space-between;padding-top:10px;font-family:\"Zilla Slab\";font-weight:700;font-size:15px}\n  .inv .tot .v{color:var(--orange)}\n\n  /* footer */\n  .bookend{background:var(--ink);color:rgba(243,239,231,.7);padding:48px 0;text-align:center}\n  .bookend .a{font-family:\"Zilla Slab\";font-weight:700;font-size:26px;color:var(--ember)}\n  .bookend p{font-size:13.5px;margin-top:8px}\n\n  @media print{\n    body{background:#fff;background-image:none}\n    section.sec{break-inside:avoid;border-bottom:1px solid #ccc}\n    .toc{position:static}\n    .cover .grid,.no-print{display:none}\n    .card,.swatch,.logo-stage,.app{box-shadow:none}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- COVER -->\n<header class=\"cover\">\n  <div class=\"grid\"><\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"lockup\">\n      <img src=\"a376758b-4e32-48b8-aec7-2e1c7e758317\" alt=\"Forge anvil mark\">\n      <span class=\"wm\"><span class=\"a\">FORGE<\u002Fspan><span class=\"b\">Handyman Service<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <span class=\"stamp\" style=\"color:var(--ember);border-color:var(--ember)\">Brand Guide · v1.0<\u002Fspan>\n    <h1 style=\"margin-top:20px\">The <span class=\"o\">Workshop<\u002Fspan><br>Brand Reference<\u002Fh1>\n    <p class=\"sub\">Everything that makes Forge look like Forge — logo, color, type, and the little details — so every door hanger, t-shirt, truck magnet, and invoice feels like it came from the same shop.<\u002Fp>\n    <div class=\"meta\">\n      <span>Prepared for<b>David &amp; Mitch Baney<\u002Fb><\u002Fspan>\n      <span>Business<b>Forge Handyman Service<\u002Fb><\u002Fspan>\n      <span>Home base<b>Garner, NC<\u002Fb><\u002Fspan>\n      <span>Updated<b>June 2026<\u002Fb><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- CONTENTS -->\n<nav class=\"toc no-print\">\n  <div class=\"wrap\">\n    <span class=\"lbl\">Contents<\u002Fspan>\n    <a href=\"#logo\"><span class=\"n\">01<\u002Fspan> Logo<\u002Fa>\n    <a href=\"#color\"><span class=\"n\">02<\u002Fspan> Color<\u002Fa>\n    <a href=\"#type\"><span class=\"n\">03<\u002Fspan> Type<\u002Fa>\n    <a href=\"#motifs\"><span class=\"n\">04<\u002Fspan> Visual Language<\u002Fa>\n    <a href=\"#components\"><span class=\"n\">05<\u002Fspan> Components<\u002Fa>\n    <a href=\"#icons\"><span class=\"n\">06<\u002Fspan> Icons<\u002Fa>\n    <a href=\"#voice\"><span class=\"n\">07<\u002Fspan> Voice<\u002Fa>\n    <a href=\"#apps\"><span class=\"n\">08<\u002Fspan> Applications<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n\n\n<!-- 01 LOGO -->\n<section class=\"sec\" id=\"logo\">\n  <div class=\"wrap\">\n    <div class=\"head\">\n      <span class=\"sec-num\">01<\u002Fspan>\n      <h2>The logo<\u002Fh2>\n      <p class=\"lead\">The anvil is the heart of the mark — it says \"made by hand, built to last.\" Pair it with the <b>FORGE<\u002Fb> wordmark set in Zilla Slab. Keep the two together whenever there's room.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"grid g2\" style=\"margin-bottom:20px\">\n      <div>\n        <div class=\"logo-stage card-bg\">\n          <div class=\"lockup-h\"><img src=\"a376758b-4e32-48b8-aec7-2e1c7e758317\" alt=\"\"><span class=\"wm\"><span class=\"a\">FORGE<\u002Fspan><span class=\"b\">Handyman Service<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"stage-note\">Primary horizontal lockup — anvil + wordmark. Use on light/paper backgrounds.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div class=\"logo-stage dark\">\n          <div class=\"lockup-v on-dark\" style=\"color:#fff\"><img src=\"a376758b-4e32-48b8-aec7-2e1c7e758317\" style=\"filter:brightness(0) invert(1)\" alt=\"\"><span class=\"a\" style=\"color:var(--ember)\">FORGE<\u002Fspan><span class=\"b\" style=\"color:rgba(243,239,231,.8)\">Handyman Service<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"stage-note\">Stacked lockup, reversed for dark backgrounds (anvil knocks out to white, wordmark shifts to ember).<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"grid g4\" style=\"margin-bottom:36px\">\n      <div>\n        <div class=\"logo-stage light\"><div class=\"lockup-h\"><img src=\"a376758b-4e32-48b8-aec7-2e1c7e758317\" alt=\"\"><span class=\"wm\"><span class=\"a\">FORGE<\u002Fspan><span class=\"b\">Handyman Service<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <p class=\"stage-note\">On Paper #EFE7D5<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div class=\"logo-stage card-bg\"><div class=\"lockup-h\"><img src=\"a376758b-4e32-48b8-aec7-2e1c7e758317\" alt=\"\"><span class=\"wm\"><span class=\"a\">FORGE<\u002Fspan><span class=\"b\">Handyman Service<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <p class=\"stage-note\">On Card #FBF6EA<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div class=\"logo-stage dark\"><div class=\"lockup-h on-dark inv\"><img src=\"a376758b-4e32-48b8-aec7-2e1c7e758317\" alt=\"\"><span class=\"wm\"><span class=\"a\">FORGE<\u002Fspan><span class=\"b\">Handyman Service<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <p class=\"stage-note\">On Ink #24211B<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div class=\"logo-stage orange\"><div class=\"lockup-h on-orange inv\"><img src=\"a376758b-4e32-48b8-aec7-2e1c7e758317\" alt=\"\"><span class=\"wm\"><span class=\"a\">FORGE<\u002Fspan><span class=\"b\">Handyman Service<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <p class=\"stage-note\">On Orange #BF5700<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"grid g2\">\n      <div>\n        <div class=\"clearspace\">\n          <div class=\"box\">\n            <div class=\"lockup-h\"><img src=\"a376758b-4e32-48b8-aec7-2e1c7e758317\" alt=\"\"><span class=\"wm\"><span class=\"a\">FORGE<\u002Fspan><span class=\"b\">Handyman Service<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <span class=\"tick\" style=\"left:-26px;top:50%;transform:translateY(-50%)\">↔<\u002Fspan>\n            <span class=\"tick\" style=\"top:-26px;left:50%;transform:translateX(-50%)\">↕<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"stage-note\">Clear space — keep a margin equal to the height of the anvil on all sides. Minimum legible size: 28px tall (digital) / 0.4in (print).<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"padding:24px\">\n        <span class=\"eyebrow\">Do &amp; Don't<\u002Fspan>\n        <div class=\"dl\" style=\"margin-top:14px\">\n          <div class=\"row\"><span class=\"k yes\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"t\"><b>Keep the orange for FORGE<\u002Fb> — it's the one place the brand orange always appears.<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span class=\"k yes\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"t\"><b>Reverse to white<\u002Fb> on photos or dark panels for contrast.<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span class=\"k no\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"t\"><b>Don't<\u002Fb> recolor the wordmark in off-brand colors or add gradients/glows.<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span class=\"k no\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"t\"><b>Don't<\u002Fb> stretch, rotate, or crowd the lockup — respect the clear space.<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span class=\"k no\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fspan><span class=\"t\"><b>Don't<\u002Fb> set the wordmark in any font but Zilla Slab.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 02 COLOR -->\n<section class=\"sec\" id=\"color\">\n  <div class=\"wrap\">\n    <div class=\"head\">\n      <span class=\"sec-num\">02<\u002Fspan>\n      <h2>Color palette<\u002Fh2>\n      <p class=\"lead\">Warm kraft neutrals do the heavy lifting; <b>forge orange<\u002Fb> is the single hero accent. Ink is the workhorse for text and structure. Everything else is used sparingly.<\u002Fp>\n    <\u002Fdiv>\n    <span class=\"eyebrow\">Core<\u002Fspan>\n    <div class=\"grid g3\" style=\"margin:14px 0 30px\" id=\"core-sw\"><\u002Fdiv>\n    <span class=\"eyebrow\">Accents &amp; neutrals<\u002Fspan>\n    <div class=\"grid g4\" style=\"margin-top:14px\" id=\"acc-sw\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 03 TYPE -->\n<section class=\"sec\" id=\"type\">\n  <div class=\"wrap\">\n    <div class=\"head\">\n      <span class=\"sec-num\">03<\u002Fspan>\n      <h2>Typography<\u002Fh2>\n      <p class=\"lead\">Two families. <b>Zilla Slab<\u002Fb> — a sturdy slab serif — carries all headlines, numbers, and the wordmark. <b>Libre Franklin<\u002Fb> handles body copy, labels, and UI. Friendly, legible, and a little bit industrial.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"grid g2\">\n      <div class=\"card type-card\">\n        <span class=\"stamp\">Display<\u002Fspan>\n        <div style=\"font-family:'Zilla Slab';font-weight:700;font-size:56px;line-height:1;margin-top:16px\">Zilla Slab<\u002Fdiv>\n        <div style=\"font-family:'Zilla Slab';font-size:20px;color:var(--ink-2);margin-top:8px\">Honest Work. Built to Last.<\u002Fdiv>\n        <div class=\"type-spec\"><span class=\"lab\">Weights<\u002Fspan><span class=\"demo\" style=\"font-family:'Zilla Slab'\"><span style=\"font-weight:500\">Medium<\u002Fspan> · <span style=\"font-weight:600\">Semibold<\u002Fspan> · <span style=\"font-weight:700\">Bold<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div class=\"type-spec\"><span class=\"lab\">Use for<\u002Fspan><span class=\"demo\" style=\"font-size:14px;color:var(--ink-2)\">Headlines, the FORGE wordmark, ticket values, big numbers, section titles.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card type-card\">\n        <span class=\"stamp\">Text<\u002Fspan>\n        <div style=\"font-family:'Libre Franklin';font-weight:700;font-size:56px;line-height:1;margin-top:16px\">Libre Franklin<\u002Fdiv>\n        <div style=\"font-family:'Libre Franklin';font-size:16px;color:var(--ink-2);margin-top:8px\">Clear, friendly, and easy to read at any size — from fine print to buttons.<\u002Fdiv>\n        <div class=\"type-spec\"><span class=\"lab\">Weights<\u002Fspan><span class=\"demo\" style=\"font-family:'Libre Franklin'\"><span style=\"font-weight:400\">Regular<\u002Fspan> · <span style=\"font-weight:600\">Semibold<\u002Fspan> · <span style=\"font-weight:700\">Bold<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <div class=\"type-spec\"><span class=\"lab\">Use for<\u002Fspan><span class=\"demo\" style=\"font-size:14px;color:var(--ink-2)\">Body copy, labels, eyebrows (uppercase + tracked), buttons, captions.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card type-card\" style=\"margin-top:20px\">\n      <span class=\"eyebrow\">Type scale<\u002Fspan>\n      <div style=\"margin-top:12px\">\n        <div class=\"scale-row\"><span class=\"tag\">H1 / Display<\u002Fspan><span style=\"font-family:'Zilla Slab';font-weight:700;font-size:40px\">Your neighborhood craftsman<\u002Fspan><\u002Fdiv>\n        <div class=\"scale-row\"><span class=\"tag\">H2 / Section<\u002Fspan><span style=\"font-family:'Zilla Slab';font-weight:700;font-size:30px\">Services for every season<\u002Fspan><\u002Fdiv>\n        <div class=\"scale-row\"><span class=\"tag\">H3 / Card<\u002Fspan><span style=\"font-family:'Zilla Slab';font-weight:700;font-size:21px\">Carpentry &amp; Woodwork<\u002Fspan><\u002Fdiv>\n        <div class=\"scale-row\"><span class=\"tag\">Eyebrow<\u002Fspan><span class=\"eyebrow\">What we do<\u002Fspan><\u002Fdiv>\n        <div class=\"scale-row\"><span class=\"tag\">Body<\u002Fspan><span style=\"font-family:'Libre Franklin';font-size:16px;color:var(--ink-2)\">One call, one craftsman, and your list gets shorter.<\u002Fspan><\u002Fdiv>\n        <div class=\"scale-row\"><span class=\"tag\">Caption<\u002Fspan><span style=\"font-family:'Libre Franklin';font-size:12.5px;color:var(--ink-3)\">Free written estimate · usually same day<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 04 MOTIFS -->\n<section class=\"sec\" id=\"motifs\">\n  <div class=\"wrap\">\n    <div class=\"head\">\n      <span class=\"sec-num\">04<\u002Fspan>\n      <h2>Visual language<\u002Fh2>\n      <p class=\"lead\">These recurring details are what make a layout feel like Forge. Use a few on any piece — they're the \"shop ticket\" personality of the brand.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"grid g4\">\n      <div class=\"card motif\"><div class=\"demo\"><span class=\"stamp\">Honest Work<\u002Fspan><\u002Fdiv><div class=\"body\"><h3>The Stamp<\u002Fh3><p>Bordered rust label with an orange dot. Use as a kicker/eyebrow.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"card motif\"><div class=\"demo\"><div class=\"mini-ticket\"><div class=\"h\">Work Order<span class=\"no\">№ 0042<\u002Fspan><\u002Fdiv><div class=\"r\">Trade<span class=\"v\">Repairs<\u002Fspan><\u002Fdiv><div class=\"r\">Estimate<span class=\"v\" style=\"color:var(--teal)\">Free<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"body\"><h3>Ticket Card<\u002Fh3><p>Work-order styling: ink header, dashed key/value rows.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"card motif\"><div class=\"demo\"><div class=\"hardshadow-demo\"><\u002Fdiv><\u002Fdiv><div class=\"body\"><h3>Hard Offset Shadow<\u002Fh3><p>No blur — a printed-sticker drop. Orange on hover.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"card motif\"><div class=\"demo\"><div class=\"seam-demo\"><\u002Fdiv><\u002Fdiv><div class=\"body\"><h3>Dashed Seam<\u002Fh3><p>Dashed dividers &amp; borders, like a perforated work ticket.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"card motif\"><div class=\"demo\"><div class=\"dots-demo\"><\u002Fdiv><\u002Fdiv><div class=\"body\"><h3>Paper Dot Texture<\u002Fh3><p>Subtle dot grid on the kraft background. Quiet, tactile.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"card motif\"><div class=\"demo\" style=\"padding:0\"><div class=\"blueprint-demo\"><\u002Fdiv><\u002Fdiv><div class=\"body\"><h3>Blueprint Grid<\u002Fh3><p>Ember grid on ink — for \"how it works\" / technical moments.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"card motif\"><div class=\"demo\"><div class=\"badge-demo\"><span class=\"n\">40<\u002Fspan><span class=\"t\">Years<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"body\"><h3>Years Badge<\u002Fh3><p>Rotated orange seal. Lead with the 40-year story.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"card motif\"><div class=\"demo\"><span style=\"font-family:'Zilla Slab';font-weight:700;font-size:30px\">every <span class=\"underline\">season<\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"body\"><h3>Marker Underline<\u002Fh3><p>Orange highlight under a key word in a headline.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 05 COMPONENTS -->\n<section class=\"sec\" id=\"components\">\n  <div class=\"wrap\">\n    <div class=\"head\">\n      <span class=\"sec-num\">05<\u002Fspan>\n      <h2>Buttons &amp; components<\u002Fh2>\n      <p class=\"lead\">Buttons have a hard bottom shadow and press down when clicked. Square-ish 3px corners; cards round a touch more.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding:30px\">\n      <div class=\"btn-row\" style=\"margin-bottom:24px\">\n        <button class=\"btn btn-primary\">Book a Job <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <button class=\"btn btn-ink\">See Services<\u002Fbutton>\n        <button class=\"btn btn-outline\">Call (555) 123-4567<\u002Fbutton>\n        <span style=\"background:var(--ink);padding:12px;border-radius:6px\"><button class=\"btn btn-white\">On Orange / Dark<\u002Fbutton><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"grid g3\" style=\"margin-top:10px\">\n        <div style=\"border:2px solid var(--ink);border-radius:8px;overflow:hidden;box-shadow:var(--shadow-card)\">\n          <div style=\"background:var(--ink);color:var(--paper);padding:12px 16px;font-family:'Zilla Slab';font-weight:700;display:flex;justify-content:space-between\"><span>Service Card<\u002Fspan><span style=\"color:var(--ember);font-family:'Libre Franklin';font-size:11px;letter-spacing:.1em;align-self:center\">№ 01<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:16px\"><h3 style=\"font-size:18px\">Drywall Repair<\u002Fh3><p style=\"font-size:13px;color:var(--ink-2);margin-top:6px\">Holes, cracks, water damage — patched and painted.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"padding:18px\"><span class=\"eyebrow\">Field<\u002Fspan><div style=\"margin-top:10px;font-size:13px;font-weight:700\">Name<\u002Fdiv><div style=\"margin-top:6px;background:#fff;border:2px solid var(--line);border-radius:5px;padding:11px 13px;color:var(--ink-3);font-size:14px\">Jane Smith<\u002Fdiv><div style=\"margin-top:10px;font-size:13px;font-weight:700\">Focused<\u002Fdiv><div style=\"margin-top:6px;background:#fff;border:2px solid var(--orange);border-radius:5px;padding:11px 13px;color:var(--ink);font-size:14px;box-shadow:0 0 0 3px rgba(191,87,0,.14)\">you@email.com<\u002Fdiv><\u002Fdiv>\n        <div class=\"card\" style=\"padding:18px\"><span class=\"eyebrow\">Chips<\u002Fspan><div style=\"display:flex;flex-direction:column;gap:8px;margin-top:10px\"><span style=\"display:flex;align-items:center;gap:9px;background:rgba(191,87,0,.07);border:2px solid var(--orange);border-radius:6px;padding:9px 12px;font-size:13px;font-weight:600\"><span style=\"width:16px;height:16px;border-radius:4px;background:var(--orange);display:flex;align-items:center;justify-content:center\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\" style=\"width:11px;height:11px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>Selected<\u002Fspan><span style=\"display:flex;align-items:center;gap:9px;background:#fff;border:2px solid var(--line);border-radius:6px;padding:9px 12px;font-size:13px;font-weight:500;color:var(--ink-2)\"><span style=\"width:16px;height:16px;border-radius:4px;border:2px solid var(--line)\"><\u002Fspan>Unselected<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 06 ICONS -->\n<section class=\"sec\" id=\"icons\">\n  <div class=\"wrap\">\n    <div class=\"head\">\n      <span class=\"sec-num\">06<\u002Fspan>\n      <h2>Iconography<\u002Fh2>\n      <p class=\"lead\">Simple le=\"border-bottom:0\">\n  <div class=\"wrap\">\n    <div class=\"head\">\n      <span class=\"sec-num\">08<\u002Fspan>\n      <h2>Applications<\u002Fh2>\n      <p class=\"lead\">A few of the system in the wild. Use these as starting points for merch and print — same logo, color, type, and details every time.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"grid g3\">\n      <!-- door hanger -->\n      <div class=\"card app\">\n        <span class=\"label\">Door Hanger<\u002Fspan>\n        <div class=\"hanger\">\n          <div class=\"hole\"><\u002Fdiv>\n          <img src=\"a376758b-4e32-48b8-aec7-2e1c7e758317\" alt=\"\">\n          <div class=\"a\">FORGE<\u002Fdiv>\n          <div class=\"b\">Handyman Service<\u002Fdiv>\n          <div class=\"tag\">Sorry we missed you!<\u002Fdiv>\n          <div class=\"msg\">We were in the neighborhood. Got a list of fixes? We'd love to help.<\u002Fdiv>\n          <div class=\"phone\">(555) 123-4567<\u002Fdiv>\n          <div class=\"pill\">Free Estimate<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- business card -->\n      <div class=\"card app\">\n        <span class=\"label\">Business Card<\u002Fspan>\n        <div class=\"bcard front\"><div class=\"grid\"><\u002Fdiv><img src=\"a376758b-4e32-48b8-aec7-2e1c7e758317\" alt=\"\"><div class=\"a\">FORGE<\u002Fdiv><div class=\"b\">Handyman Service<\u002Fdiv><\u002Fdiv>\n        <div class=\"bcard back\">\n          <div class=\"nm\">David Baney<\u002Fdiv>\n          <div class=\"ro\">Owner &amp; Craftsman<\u002Fdiv>\n          <div class=\"rule\"><\u002Fdiv>\n          <div class=\"ln\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z\"><\u002Fpath><\u002Fsvg>(555) 123-4567<\u002Fdiv>\n          <div class=\"ln\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"m3 7 9 6 9-6\"><\u002Fpath><\u002Fsvg>david@forgehandyman.com<\u002Fdiv>\n          <div class=\"ln\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.5\"><\u002Fcircle><\u002Fsvg>Garner, NC<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- yard sign -->\n      <div class=\"card app\">\n        <span class=\"label\">Yard Sign<\u002Fspan>\n        <div class=\"yard\">\n          <div class=\"sign\">\n            <div class=\"grid\"><\u002Fdiv>\n            <div class=\"a\">FORGE<\u002Fdiv>\n            <div class=\"b\">Handyman Service<\u002Fdiv>\n            <div class=\"tag\">Honest Work. Built to Last.<\u002Fdiv>\n            <div class=\"phone\">(555) 123-4567<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"stakes\"><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- t-shirt left chest -->\n      <div class=\"card app\">\n        <span class=\"label\">Work Tee · Left Chest<\u002Fspan>\n        <div style=\"width:200px;height:170px;background:var(--ink);border:2px solid var(--ink);border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card)\">\n          <div style=\"text-align:center\"><img src=\"a376758b-4e32-48b8-aec7-2e1c7e758317\" style=\"height:48px;filter:brightness(0) invert(1);margin:0 auto\" alt=\"\"><div style=\"font-family:'Zilla Slab';font-weight:700;font-size:24px;color:var(--ember);margin-top:4px\">FORGE<\u002Fdiv><div style=\"font-family:'Libre Franklin';font-weight:700;font-size:7px;letter-spacing:.18em;text-transform:uppercase;color:rgba(243,239,231,.78)\">Handyman Service<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:12px;color:var(--ink-3);text-align:center\">Charcoal tee, reversed lockup. Full set of concepts available separately.<\u002Fp>\n      <\u002Fdiv>\n      <!-- truck magnet -->\n      <div class=\"card app\">\n        <span class=\"label\">Truck Magnet<\u002Fspan>\n        <div style=\"width:230px;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:16px 18px;box-shadow:var(--shadow-card)\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><img src=\"a376758b-4e32-48b8-aec7-2e1c7e758317\" style=\"height:38px\" alt=\"\"><div><div style=\"font-family:'Zilla Slab';font-weight:700;font-size:24px;color:var(--orange);line-height:.85\">FORGE<\u002Fdiv><div style=\"font-family:'Libre Franklin';font-weight:700;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)\">Handyman Service<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"margin-top:12px;border-top:1.5px dashed var(--line);padding-top:10px;display:flex;justify-content:space-between;align-items:center\"><span style=\"font-family:'Zilla Slab';font-weight:700;font-size:16px\">(555) 123-4567<\u002Fspan><span style=\"font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)\">Fully Insured<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:12px;color:var(--ink-3);text-align:center\">High-contrast for visibility at a distance.<\u002Fp>\n      <\u002Fdiv>\n      <!-- invoice -->\n      <div class=\"card app\">\n        <span class=\"label\">Invoice / Estimate<\u002Fspan>\n        <div class=\"inv\">\n          <div class=\"top\"><div class=\"lk\"><img src=\"a376758b-4e32-48b8-aec7-2e1c7e758317\" alt=\"\"><div><div class=\"a\">FORGE<\u002Fdiv><div class=\"b\">Handyman Service<\u002Fdiv><\u002Fdiv><\u002Fdiv><span class=\"doc\">Estimate<\u002Fspan><\u002Fdiv>\n          <div class=\"body2\">\n            <div class=\"li\">Carpentry &amp; trim repair <span class=\"v\">$340<\u002Fspan><\u002Fdiv>\n            <div class=\"li\">Ceiling fan install <span class=\"v\">$120<\u002Fspan><\u002Fdiv>\n            <div class=\"li\">Drywall patch &amp; paint <span class=\"v\">$180<\u002Fspan><\u002Fdiv>\n            <div class=\"tot\">Total <span class=\"v\">$640<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:12px;color:var(--ink-3);text-align:center\">Same ticket styling as the website's work order.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer class=\"bookend\">\n  <div class=\"a\">FORGE<\u002Fdiv>\n  <p>Honest Work. Built to Last. · Forge Handyman Service · Garner, NC · (555) 123-4567<\u002Fp>\n  <p style=\"margin-top:6px;opacity:.6\">Brand guide v1.0 — June 2026. Questions about usage? Just ask.<\u002Fp>\n<\u002Ffooter>\n\n<script>\n  const svg=(p,sw=2)=>`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"${sw}\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${p}<\u002Fsvg>`;\n\n  const CORE=[\n    ['Forge Orange','#BF5700','#fff','Primary accent. The FORGE wordmark, buttons, key highlights. Use with intent — one hero color.'],\n    ['Ink','#24211B','#EFE7D5','Body text, headlines, borders, dark panels & footers. The structural workhorse.'],\n    ['Paper','#EFE7D5','#24211B','The page background. Warm kraft with a faint dot texture.'],\n  ];\n  const ACC=[\n    ['Card','#FBF6EA','#24211B','Raised surfaces — cards, tickets, forms.'],\n    ['Rust','#9E3C0B','#fff','Button hard-shadow & stamp borders. Deeper orange.'],\n    ['Ember','#E27A20','#24211B','Warm highlight & icons on dark / blueprint.'],\n    ['Teal','#2E5D55','#fff','Sparing positive accent — \"Free,\" success.'],\n    ['Ink 2','#433D32','#EFE7D5','Secondary text.'],\n    ['Ink 3','#6B6353','#EFE7D5','Muted text, captions, hints.'],\n    ['Line','#CDBF9F','#24211B','Hairlines & dashed seams.'],\n    ['Orange 2','#D8650A','#fff','Hover state for primary orange.'],\n  ];\n  const sw=([nm,hex,txt,use])=>`<div class=\"swatch\"><div class=\"chip\" style=\"background:${hex}\"><span class=\"role\" style=\"color:${hex}\">${hex}<\u002Fspan><\u002Fdiv><div class=\"meta\"><div class=\"nm\">${nm}<\u002Fdiv><div class=\"hex\">${hex}<\u002Fdiv><div class=\"use\">${use}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  document.getElementById('core-sw').innerHTML=CORE.map(sw).join('');\n  document.getElementById('acc-sw').innerHTML=ACC.map(sw).join('');\n\n  const ICONS={\n    wrench:'<path d=\"M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8 6.2 21l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.5 2.5-2.3-.4-.4-2.3 2.5-2.5Z\"/>',\n    saw:'<path d=\"M3 17h13l5-5-4-1-1-4-5 5v6Z\"/><path d=\"M3 17l-1 3 3-1\"/><path d=\"M16 4l4 4\"/>',\n    brush:'<path d=\"M9 11V4a2 2 0 0 1 4 0v7\"/><path d=\"M5 11h14v3a4 4 0 0 1-4 4h-1v3H10v-3H9a4 4 0 0 1-4-4v-3Z\"/>',\n    fence:'<path d=\"M4 8 6 4l2 4v12H4V8Zm8 0 2-4 2 4v12h-4V8Z\"/><path d=\"M2 11h20M2 16h20\"/>',\n    lightbulb:'<path d=\"M9 18h6M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3Z\"/>',\n    box:'<path d=\"m3 8 9-5 9 5v8l-9 5-9-5V8Z\"/><path d=\"m3 8 9 5 9-5M12 13v8\"/>',\n    spray:'<path d=\"M7 8h6v13H7zM7 8V5h6v3M9 3h2M16 6l3-1M16 10l3 0M16 14l3 1\"/>',\n    panel:'<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"1\"/><path d=\"M3 12h18M12 3v18\"/>',\n    hammer:'<path d=\"M14 6 9 11l-2-2-4 4 4 4 4-4-2-2 5-5\"/><path d=\"M14 6l2-2 4 4-2 2-4-4Z\"/>',\n    home:'<path d=\"m3 11 9-8 9 8\"/><path d=\"M5 9v11h14V9\"/><path d=\"M9 20v-6h6v6\"/>',\n    shield:'<path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z\"/>',\n    tag:'<path d=\"M3 3h8l10 10-8 8L3 11V3Z\"/><circle cx=\"7.5\" cy=\"7.5\" r=\"1.5\"/>',\n  };\n  const NAMES={wrench:'Repairs',saw:'Carpentry',brush:'Painting',fence:'Deck & Fence',lightbulb:'Fixtures',box:'Assembly',spray:'Pressure Wash',panel:'Drywall',hammer:'Experience',home:'Local',shield:'Insured',tag:'Free Estimate'};\n  document.getElementById('icogrid').innerHTML=Object.keys(ICONS).map(k=>`<div class=\"ico-tile\"><div class=\"box\">${svg(ICONS[k],1.8)}<\u002Fdiv><span class=\"nm\">${NAMES[k]}<\u002Fspan><\u002Fdiv>`).join('');\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
